spring:
  application:
    name: portagraph
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portagraph}
    username: ${DB_USER:portagraph}
    password: ${DB_PASSWORD:portagraph}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

portagraph:
  public-url: ${PUBLIC_URL:http://localhost:8080}
  security:
    jwt-secret: ${JWT_SECRET}
    credential-key: ${CREDENTIAL_KEY}   # 32 байта в Base64: openssl rand -base64 32
    token-ttl: PT8H
  agent:
    url: ${HERMES_URL:http://localhost:8642}
    api-key: ${HERMES_API_KEY:}
  llm:
    url: ${LLM_URL:https://api.openai.com}
    api-key: ${LLM_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:portagraph-artifacts}
