# Локальный запуск PortaGraph: docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: portagraph
      POSTGRES_USER: portagraph
      POSTGRES_PASSWORD: portagraph
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portagraph"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio:/data]
    ports: ["9001:9001"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portagraph
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8080

  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    ports: ["80:80"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]

volumes:
  pgdata:
  minio:
